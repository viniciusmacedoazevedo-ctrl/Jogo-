# Compila o app iOS num Mac do GitHub e publica o Brotim.ipa (sem assinatura)
# como artefato. Instale no iPhone com Sideloadly ou AltStore (eles assinam
# com o seu Apple ID). Veja ios/README.md.
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'game/**'
      - 'android/dist/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write   # para publicar o .ipa na Release "ios-latest"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -project ios/Brotim.xcodeproj -scheme Brotim -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Conferir o app
        run: |
          APP=build/Build/Products/Release-iphoneos/Brotim.app
          test -f "$APP/game/index.html"
          test -f "$APP/game/js/main.js"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|UISupportedInterfaceOrientations" -A2
          ls "$APP" | head -30

      - name: Empacotar Brotim.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Brotim.app Payload/
          zip -qry Brotim.ipa Payload
          ls -la Brotim.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Brotim-ios-ipa
          path: Brotim.ipa
          retention-days: 90

      - name: Publicar na Release ios-latest (link fixo para baixar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ios-latest Brotim.ipa android/dist/brotim.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Brotim (build mais recente)" \
            --notes "Brotim.ipa: iPhone/iPad (instale com Sideloadly ou AltStore, veja ios/README.md). brotim.apk: Android 7.0+. Gerado a partir do commit $GITHUB_SHA."
