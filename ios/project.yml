# Projeto iOS do Brotim, gerado com XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen
#   cd ios && xcodegen generate && open Brotim.xcodeproj
name: Brotim
options:
  bundleIdPrefix: com.brotim
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
targets:
  Brotim:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # o jogo web inteiro vai para dentro do app como a pasta "game"
      - path: ../game
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brotim.jogo
        PRODUCT_NAME: Brotim
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Brotim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        ITSAppUsesNonExemptEncryption: false
